name: build-exe
# Manual build (Actions → build-exe → Run workflow); releases come from release.yml on tags.
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements.txt "pyinstaller>=6.22"
      - run: python -m PyInstaller --noconfirm --clean Mitsuke.spec
      - uses: actions/upload-artifact@v4
        with: { name: Mitsuke, path: dist/Mitsuke }
